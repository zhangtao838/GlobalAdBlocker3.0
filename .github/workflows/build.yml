name: Build GlobalAdBlocker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: roothide
            artifact: GlobalAdBlocker-roothide
          - scheme: rootless
            artifact: GlobalAdBlocker-rootless

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install dpkg ldid xz || true

      - name: Install roothide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Fix fakeroot on Apple Silicon
        run: |
          sed -i '' 's/$(FAKEROOT) -c/true/' $THEOS/makefiles/stage.mk
          sed -i '' 's/$(FAKEROOT) -r //' $THEOS/makefiles/package/deb.mk

      - name: Download iPhoneOS 26.5 SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          cd /tmp/ios-sdks
          git sparse-checkout set iPhoneOS26.5.sdk
          cp -r iPhoneOS26.5.sdk $THEOS/sdks/
          echo "Available SDKs:"
          ls -la $THEOS/sdks/

      - name: Build (${{ matrix.scheme }})
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}
          echo "Build output:"
          ls -la packages/

      - name: Rename deb
        run: |
          cd packages
          for f in *.deb; do
            mv "$f" "$(basename "$f" .deb)_${{ matrix.scheme }}.deb"
          done
          ls -la

      - name: Upload deb (${{ matrix.scheme }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/*.deb
          retention-days: 30
